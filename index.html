<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deck Duel</title>
  <style>
    :root {
      --bg1: #101826;
      --bg2: #18263d;
      --panel: #111d2e;
      --panel-alt: #172b42;
      --line: #2d4668;
      --text: #ecf5ff;
      --muted: #9ab4cf;
      --blue: #69c7ff;
      --blue2: #3ca5ff;
      --green: #7ce8b0;
      --orange: #ffb86d;
      --red: #ff7878;
      --purple: #d7a8ff;
      --gold: #ffd36a;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, #0f1a2d, #0a0f18 65%);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10px;
    }

    .phone {
      width: min(420px, 100vw - 10px);
      min-height: calc(100vh - 16px);
      background: linear-gradient(180deg, var(--bg2), var(--bg1));
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 60px var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(8, 14, 21, 0.65);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .brand {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: var(--blue);
    }

    .tiny {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .screen {
      flex: 1;
      overflow: auto;
      padding: 12px 12px 76px;
    }

    .section {
      display: none;
      gap: 12px;
      flex-direction: column;
    }

    .section.active {
      display: flex;
    }

    .card {
      background: linear-gradient(180deg, var(--panel-alt), var(--panel));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      padding: 12px;
    }

    .home-empty {
      min-height: 220px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      border: 1px dashed rgba(255,255,255,.14);
      border-radius: 12px;
      background: rgba(255,255,255,.02);
    }

    .deck-top {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .search {
      flex: 1;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px;
      height: 42px;
      color: var(--text);
      padding: 0 12px;
      font-size: 15px;
    }

    .small-btn {
      height: 42px;
      border: 0;
      border-radius: 10px;
      padding: 0 12px;
      background: linear-gradient(180deg, var(--blue2), #1f69d4);
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .mini-card {
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      padding: 10px;
    }

    .mini-card h4 {
      margin: 0 0 6px;
      font-size: 13px;
      line-height: 1.3;
    }

    .mini-meta {
      color: var(--muted);
      font-size: 10px;
      margin-bottom: 8px;
    }

    .mini-card button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      height: 32px;
      font-weight: 800;
      background: linear-gradient(180deg, #42a6ff, #2367ca);
      color: var(--text);
      cursor: pointer;
    }

    .deck-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 260px;
      overflow: auto;
    }

    .deck-item {
      background: rgba(255,255,255,.02);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .deck-item-name {
      font-size: 12px;
      font-weight: 700;
    }

    .deck-item-sub {
      font-size: 10px;
      color: var(--muted);
    }

    .deck-item button {
      border: 0;
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .battle-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .battle-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
    }

    .life-box {
      flex: 1;
      background: rgba(255,255,255,.02);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }

    .life-box strong {
      display: block;
      font-size: 24px;
      margin-top: 4px;
    }

    .turn-card {
      padding: 12px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
    }

    .battle-log {
      min-height: 190px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .battle-log .line {
      background: rgba(255,255,255,.02);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 8px;
      padding: 8px 10px;
      line-height: 1.5;
    }

    .battle-actions {
      display: flex;
      gap: 8px;
    }

    .battle-actions button {
      flex: 1;
      height: 42px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(180deg, #2fb57d, #1f7d5f);
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
    }

    .battle-actions button.secondary {
      background: linear-gradient(180deg, #ef8e5c, #c6683d);
    }

    .bottom-nav {
      position: sticky;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: rgba(10, 18, 28, 0.92);
      border-top: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(12px);
    }

    .nav-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    .nav-btn.active {
      color: var(--text);
      background: rgba(105, 199, 255, 0.09);
    }

    @media (max-width: 420px) {
      body { padding: 0; }
      .phone {
        width: 100vw;
        min-height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <div class="brand">DUEL</div>
      <div class="tiny">battle app</div>
    </header>

    <main class="screen">
      <section id="homeTab" class="section active">
        <div class="card home-empty">
          <div>
            <div class="tiny" style="margin-bottom:8px;">HOME</div>
            <div style="font-size:18px; font-weight:800;">デュエルの準備をしよう</div>
          </div>
        </div>
      </section>

      <section id="deckTab" class="section">
        <div class="card">
          <div class="deck-top">
            <input id="cardSearch" class="search" placeholder="カードを検索" />
            <button class="small-btn" id="refreshCards">更新</button>
          </div>
        </div>

        <div class="card">
          <div class="tiny" style="margin-bottom:10px;">カード一覧</div>
          <div id="cardGrid" class="mini-grid"></div>
        </div>

        <div class="card">
          <div class="tiny" style="margin-bottom:10px;">現在のデッキ <span id="deckCount">0 / 60</span></div>
          <div id="deckList" class="deck-list"></div>
        </div>
      </section>

      <section id="battleTab" class="section">
        <div class="card battle-wrap">
          <div class="battle-header">
            <div class="life-box">
              <div class="tiny">PLAYER</div>
              <strong id="playerLife">8000</strong>
            </div>
            <div class="life-box">
              <div class="tiny">AI</div>
              <strong id="aiLife">8000</strong>
            </div>
          </div>

          <div class="turn-card">
            <div class="tiny" style="margin-bottom:6px;">ターン</div>
            <div style="font-size:24px; font-weight:900;" id="turnLabel">1</div>
          </div>

          <div class="card" style="padding:10px;">
            <div class="tiny" style="margin-bottom:8px;">バトルログ</div>
            <div id="battleLog" class="battle-log"></div>
          </div>

          <div class="battle-actions">
            <button id="startBattle">対戦開始</button>
            <button id="nextTurn" class="secondary">次ターン</button>
          </div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="home">ホーム</button>
      <button class="nav-btn" data-tab="deck">デッキ</button>
      <button class="nav-btn" data-tab="battle">対戦</button>
    </nav>
  </div>

  <script>
    const state = {
      activeTab: 'home',
      cards: [],
      deck: [],
      battle: {
        running: false,
        turn: 1,
        playerLife: 8000,
        aiLife: 8000,
        logs: []
      },
      aiDecks: [
        ['青眼の白龍', '黒魔術の儀式', 'ブラック・マジシャン', 'スライム', 'サンダー・ドラゴン'],
        ['サイバー・ドラゴン', 'マジック・キャンサー', 'ファイアー・ボール', '真紅眼の黒龍', '闇のデッキ'],
        ['海皇の咆哮', '白き森の妖精', 'レッド・デーモン', '破壊剣', 'ライトニング・ドラゴン']
      ]
    };

    const navButtons = document.querySelectorAll('.nav-btn');
    const sections = {
      home: document.getElementById('homeTab'),
      deck: document.getElementById('deckTab'),
      battle: document.getElementById('battleTab')
    };

    function setTab(tab) {
      state.activeTab = tab;
      navButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      Object.entries(sections).forEach(([name, el]) => {
        el.classList.toggle('active', name === tab);
      });
    }

    navButtons.forEach(btn => {
      btn.addEventListener('click', () => setTab(btn.dataset.tab));
    });

    function getSearchText() {
      return document.getElementById('cardSearch').value.trim().toLowerCase();
    }

    function cardMatches(card, keyword) {
      if (!keyword) return true;
      const name = (card.name || '').toLowerCase();
      const type = (card.type || '').toLowerCase();
      return name.includes(keyword) || type.includes(keyword);
    }

    function renderCardGrid() {
      const grid = document.getElementById('cardGrid');
      const q = getSearchText();
      const filtered = state.cards.filter(card => cardMatches(card, q)).slice(0, 20);

      if (!filtered.length) {
        grid.innerHTML = '<div class="mini-card"><h4>カードが見つかりません</h4><div class="mini-meta">検索条件を変えてみてください</div></div>';
        return;
      }

      grid.innerHTML = filtered.map(card => {
        const already = state.deck.some(item => item.id === card.id);
        const atk = card.atk ?? '—';
        const def = card.def ?? '—';
        return `
          <div class="mini-card">
            <h4>${card.name}</h4>
            <div class="mini-meta">${card.type || 'カード'} / ATK ${atk} / DEF ${def}</div>
            <button data-add="${card.id}" ${already ? 'disabled' : ''}>${already ? '追加済み' : '追加'}</button>
          </div>
        `;
      }).join('');

      grid.querySelectorAll('[data-add]').forEach(button => {
        button.addEventListener('click', () => addToDeck(Number(button.dataset.add)));
      });
    }

    function addToDeck(cardId) {
      if (state.deck.length >= 60) {
        alert('デッキは60枚までです。');
        return;
      }
      const card = state.cards.find(item => item.id === cardId);
      if (!card) return;
      state.deck.push({
        id: card.id,
        name: card.name,
        type: card.type,
        atk: card.atk ?? 0,
        def: card.def ?? 0,
        level: card.level ?? 0,
        image: card.card_images?.[0]?.image_url_small || ''
      });
      renderDeckList();
      renderCardGrid();
    }

    function removeFromDeck(cardId) {
      state.deck = state.deck.filter(item => item.id !== cardId);
      renderDeckList();
      renderCardGrid();
    }

    function renderDeckList() {
      const list = document.getElementById('deckList');
      const count = document.getElementById('deckCount');
      count.textContent = `${state.deck.length} / 60`;

      if (!state.deck.length) {
        list.innerHTML = '<div class="deck-item"><div><div class="deck-item-name">デッキが空です</div><div class="deck-item-sub">カードを追加して作成</div></div></div>';
        return;
      }

      list.innerHTML = state.deck.map(card => `
        <div class="deck-item">
          <div>
            <div class="deck-item-name">${card.name}</div>
            <div class="deck-item-sub">${card.type} / ATK ${card.atk}</div>
          </div>
          <button data-remove="${card.id}">削除</button>
        </div>
      `).join('');

      list.querySelectorAll('[data-remove]').forEach(button => {
        button.addEventListener('click', () => removeFromDeck(Number(button.dataset.remove)));
      });
    }

    function buildAiDeck() {
      if (!state.cards.length) {
        return [
          { id: 1, name: '青眼の白龍', atk: 3000, def: 2500, type: 'ドラゴン' },
          { id: 2, name: 'ブラック・マジシャン', atk: 2500, def: 2100, type: '魔法使い' },
          { id: 3, name: 'サンダー・ドラゴン', atk: 2400, def: 2000, type: 'ドラゴン' },
          { id: 4, name: 'スライム', atk: 800, def: 1000, type: '水' }
        ];
      }
      const pool = state.cards.slice();
      const chosen = [];
      while (chosen.length < 6) {
        const card = pool[Math.floor(Math.random() * pool.length)];
        if (!card) break;
        chosen.push({
          id: card.id,
          name: card.name,
          atk: card.atk ?? 1200,
          def: card.def ?? 1200,
          type: card.type || '通常'
        });
      }
      return chosen;
    }

    function addLog(text) {
      const logBox = document.getElementById('battleLog');
      const line = document.createElement('div');
      line.className = 'line';
      line.textContent = text;
      logBox.prepend(line);
    }

    function updateBattleHud() {
      document.getElementById('playerLife').textContent = state.battle.playerLife;
      document.getElementById('aiLife').textContent = state.battle.aiLife;
      document.getElementById('turnLabel').textContent = state.battle.turn;
    }

    function startBattle() {
      if (!state.deck.length) {
        alert('デッキを先に作成してください。');
        setTab('deck');
        return;
      }

      state.battle.running = true;
      state.battle.turn = 1;
      state.battle.playerLife = 8000;
      state.battle.aiLife = 8000;
      state.battle.logs = [];
      document.getElementById('battleLog').innerHTML = '';

      const aiDeck = buildAiDeck();
      state.aiDeck = aiDeck;

      addLog('AIがデッキを選択しました。対戦開始！');
      addLog('デッキの強さを比較して、ターンを進めます。');
      updateBattleHud();
    }

    function takeTurn() {
      if (!state.battle.running) {
        addLog('まず対戦開始を押して、デッキを選択してください。');
        return;
      }

      const playerCard = state.deck[Math.floor(Math.random() * state.deck.length)] || { name: 'プレイヤーのカード', atk: 1200 };
      const aiCard = (state.aiDeck || []).sort((a, b) => (b.atk || 0) - (a.atk || 0))[0] || { name: 'AIカード', atk: 1200 };

      const playerPower = Number(playerCard.atk) || 1200;
      const aiPower = Number(aiCard.atk) || 1200;

      let playerDamage = 0;
      let aiDamage = 0;

      if (playerPower >= aiPower) {
        aiDamage = playerPower - aiPower + 300;
        state.battle.aiLife = Math.max(0, state.battle.aiLife - aiDamage);
      } else {
        playerDamage = aiPower - playerPower + 300;
        state.battle.playerLife = Math.max(0, state.battle.playerLife - playerDamage);
      }

      addLog(`ターン ${state.battle.turn}: ${playerCard.name} (${playerPower}) vs ${aiCard.name} (${aiPower})`);
      addLog(`${playerDamage ? 'AIが' + playerDamage + 'ダメージ' : 'プレイヤーが' + aiDamage + 'ダメージ'}を与えました。`);
      addLog(`PLAYER ${state.battle.playerLife} / AI ${state.battle.aiLife}`);

      state.battle.turn += 1;
      updateBattleHud();

      if (state.battle.playerLife <= 0) {
        addLog('AIの勝利です。');
        state.battle.running = false;
      }
      if (state.battle.aiLife <= 0) {
        addLog('プレイヤーの勝利です。');
        state.battle.running = false;
      }
    }

    document.getElementById('cardSearch').addEventListener('input', renderCardGrid);
    document.getElementById('refreshCards').addEventListener('click', loadCards);
    document.getElementById('startBattle').addEventListener('click', startBattle);
    document.getElementById('nextTurn').addEventListener('click', takeTurn);

    async function loadCards() {
      try {
        const response = await fetch('https://db.ygoprodeck.com/api/v7/cardinfo.php?num=20&offset=0');
        const data = await response.json();
        state.cards = (data && data.data) ? data.data : [];
      } catch (error) {
        state.cards = [
          { id: 1, name: '青眼の白龍', type: 'ドラゴン', atk: 3000, def: 2500 },
          { id: 2, name: 'ブラック・マジシャン', type: '魔法使い', atk: 2500, def: 2100 },
          { id: 3, name: 'サンダー・ドラゴン', type: 'ドラゴン', atk: 2400, def: 2000 },
          { id: 4, name: 'スライム', type: '水', atk: 800, def: 1000 },
          { id: 5, name: '魔法の兵士', type: '戦士', atk: 1400, def: 1200 }
        ];
      }
      renderCardGrid();
      renderDeckList();
    }

    setTab('home');
    loadCards();
    updateBattleHud();
  </script>
</body>
</html>
