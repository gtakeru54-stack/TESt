<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #1f2937;
      --grid: #374151;
      --text: #e5e7eb;
      --accent: #60a5fa;
      --danger: #f87171;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f172a, #111827);
      color: var(--text);
      font-family: sans-serif;
    }

    .game {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      background: rgba(31, 41, 55, 0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    canvas {
      display: block;
      background: #000;
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 8px;
    }

    .side {
      width: 140px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 12px 10px;
    }

    .panel h3 {
      margin: 0 0 10px;
      font-size: 14px;
      letter-spacing: 0.08em;
      color: #cbd5e1;
    }

    .stats {
      font-size: 18px;
      font-weight: bold;
    }

    .controls {
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: 13px;
      line-height: 1.7;
      color: #dbeafe;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--accent);
      color: #0b1120;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.08);
    }
  </style>
</head>
<body>
  <div class="game">
    <canvas id="board" width="300" height="600"></canvas>

    <div class="side">
      <div class="panel">
        <h3>Next</h3>
        <canvas id="next" width="120" height="120"></canvas>
      </div>

      <div class="panel">
        <h3>Score</h3>
        <div class="stats" id="score">0</div>
      </div>

      <div class="panel">
        <h3>Lines</h3>
        <div class="stats" id="lines">0</div>
      </div>

      <div class="panel">
        <h3>Level</h3>
        <div class="stats" id="level">1</div>
      </div>

      <div class="panel">
        <h3>Controls</h3>
        <ul class="controls">
          <li>← → Move</li>
          <li>↓ Soft drop</li>
          <li>↑ Rotate</li>
          <li>Space Hard drop</li>
          <li>P Pause</li>
        </ul>
      </div>

      <button id="startBtn">Start / Restart</button>
    </div>
  </div>

  <script>
    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 30;
    const EMPTY = 0;

    const boardCanvas = document.getElementById('board');
    const boardCtx = boardCanvas.getContext('2d');

    const nextCanvas = document.getElementById('next');
    const nextCtx = nextCanvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const linesEl = document.getElementById('lines');
    const levelEl = document.getElementById('level');
    const startBtn = document.getElementById('startBtn');

    const COLORS = {
      I: '#38bdf8',
      O: '#facc15',
      T: '#a78bfa',
      S: '#4ade80',
      Z: '#f87171',
      J: '#60a5fa',
      L: '#fb923c'
    };

    const SHAPES = {
      I: [
        [1, 1, 1, 1]
      ],
      O: [
        [1, 1],
        [1, 1]
      ],
      T: [
        [1, 1, 1],
        [0, 1, 0]
      ],
      S: [
        [0, 1, 1],
        [1, 1, 0]
      ],
      Z: [
        [1, 1, 0],
        [0, 1, 1]
      ],
      J: [
        [1, 0, 0],
        [1, 1, 1]
      ],
      L: [
        [0, 0, 1],
        [1, 1, 1]
      ]
    };

    let board = [];
    let current = null;
    let next = null;
    let score = 0;
    let lines = 0;
    let level = 1;
    let dropInterval = 700;
    let dropTimer = null;
    let gameOver = false;
    let paused = false;

    function createBoard() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(EMPTY));
    }

    function cloneMatrix(matrix) {
      return matrix.map(row => [...row]);
    }

    function randomPiece() {
      const keys = Object.keys(SHAPES);
      const name = keys[Math.floor(Math.random() * keys.length)];
      const matrix = cloneMatrix(SHAPES[name]);
      return { type: name, matrix };
    }

    function resetGame() {
      board = createBoard();
      score = 0;
      lines = 0;
      level = 1;
      dropInterval = 700;
      gameOver = false;
      paused = false;
      current = randomPiece();
      next = randomPiece();
      current.x = Math.floor((COLS - current.matrix[0].length) / 2);
      current.y = -1;
      updateUI();
      drawBoard();
      drawNext();
      startDrop();
    }

    function updateUI() {
      scoreEl.textContent = String(score);
      linesEl.textContent = String(lines);
      levelEl.textContent = String(level);
    }

    function startDrop() {
      clearInterval(dropTimer);
      dropTimer = setInterval(() => {
        if (!paused && !gameOver) {
          moveDown();
        }
      }, dropInterval);
    }

    function collides(matrix, offsetX, offsetY) {
      for (let y = 0; y < matrix.length; y++) {
        for (let x = 0; x < matrix[y].length; x++) {
          if (!matrix[y][x]) continue;
          const newX = x + offsetX;
          const newY = y + offsetY;

          if (newX < 0 || newX >= COLS || newY >= ROWS) return true;

          if (newY >= 0 && board[newY][newX] !== EMPTY) return true;
        }
      }
      return false;
    }

    function mergePiece() {
      current.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (!value) return;
          const boardY = current.y + y;
          const boardX = current.x + x;
          if (boardY >= 0) {
            board[boardY][boardX] = current.type;
          }
        });
      });
    }

    function clearLines() {
      let cleared = 0;
      for (let y = ROWS - 1; y >= 0; y--) {
        if (board[y].every(cell => cell !== EMPTY)) {
          board.splice(y, 1);
          board.unshift(Array(COLS).fill(EMPTY));
          cleared++;
          y++;
        }
      }

      if (cleared > 0) {
        lines += cleared;
        const lineScores = [0, 100, 300, 500, 800];
        score += lineScores[cleared] * level;
        level = Math.floor(lines / 10) + 1;
        dropInterval = Math.max(120, 700 - (level - 1) * 60);
        startDrop();
      }
    }

    function spawnPiece() {
      current = next;
      current.x = Math.floor((COLS - current.matrix[0].length) / 2);
      current.y = -1;

      next = randomPiece();

      if (collides(current.matrix, current.x, current.y)) {
        gameOver = true;
        clearInterval(dropTimer);
        alert('Game Over');
      }
    }

    function moveDown() {
      if (!current) return;
      if (!collides(current.matrix, current.x, current.y + 1)) {
        current.y++;
      } else {
        mergePiece();
        clearLines();
        spawnPiece();
      }
      drawBoard();
      drawNext();
      updateUI();
    }

    function moveHoriz(dir) {
      if (gameOver || paused) return;
      if (!collides(current.matrix, current.x + dir, current.y)) {
        current.x += dir;
        drawBoard();
      }
    }

    function rotateMatrix(matrix) {
      const rows = matrix.length;
      const cols = matrix[0].length;
      const rotated = Array.from({ length: cols }, () => Array(rows).fill(0));

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          rotated[x][rows - 1 - y] = matrix[y][x];
        }
      }
      return rotated;
    }

    function rotateCurrent() {
      if (gameOver || paused || !current) return;

      const rotated = rotateMatrix(current.matrix);
      const kicks = [0, -1, 1, -2, 2];

      for (const kick of kicks) {
        if (!collides(rotated, current.x + kick, current.y)) {
          current.matrix = rotated;
          current.x += kick;
          drawBoard();
          return;
        }
      }
    }

    function hardDrop() {
      if (gameOver || paused) return;

      while (!collides(current.matrix, current.x, current.y + 1)) {
        current.y++;
        score += 2;
      }

      mergePiece();
      clearLines();
      spawnPiece();
      updateUI();
      drawBoard();
      drawNext();
    }

    function drawCell(ctx, x, y, color, size = BLOCK) {
      ctx.fillStyle = color;
      ctx.fillRect(x * size, y * size, size, size);

      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.strokeRect(x * size + 0.5, y * size + 0.5, size - 1, size - 1);
    }

    function drawBoard() {
      boardCtx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);

      // background grid
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          boardCtx.strokeStyle = 'rgba(255,255,255,0.06)';
          boardCtx.strokeRect(x * BLOCK, y * BLOCK, BLOCK, BLOCK);
        }
      }

      // placed blocks
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (board[y][x] !== EMPTY) {
            drawCell(boardCtx, x, y, COLORS[board[y][x]]);
          }
        }
      }

      // current piece
      if (current) {
        current.matrix.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value) {
              const drawX = current.x + x;
              const drawY = current.y + y;
              if (drawY >= 0) {
                drawCell(boardCtx, drawX, drawY, COLORS[current.type]);
              }
            }
          });
        });
      }

      if (paused) {
        boardCtx.fillStyle = 'rgba(17, 24, 39, 0.5)';
        boardCtx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
        boardCtx.fillStyle = '#f8fafc';
        boardCtx.font = 'bold 28px sans-serif';
        boardCtx.textAlign = 'center';
        boardCtx.fillText('PAUSE', boardCanvas.width / 2, boardCanvas.height / 2 + 10);
      }

      if (gameOver) {
        boardCtx.fillStyle = 'rgba(17, 24, 39, 0.55)';
        boardCtx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
        boardCtx.fillStyle = '#fca5a5';
        boardCtx.font = 'bold 28px sans-serif';
        boardCtx.textAlign = 'center';
        boardCtx.fillText('GAME OVER', boardCanvas.width / 2, boardCanvas.height / 2 + 10);
      }
    }

    function drawNext() {
      nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);

      const size = 24;
      const offsetX = Math.floor((nextCanvas.width - next.matrix[0].length * size) / 2);
      const offsetY = Math.floor((nextCanvas.height - next.matrix.length * size) / 2);

      next.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value) {
            nextCtx.fillStyle = COLORS[next.type];
            nextCtx.fillRect(offsetX + x * size, offsetY + y * size, size, size);
            nextCtx.strokeStyle = 'rgba(255,255,255,0.15)';
            nextCtx.strokeRect(offsetX + x * size + 0.5, offsetY + y * size + 0.5, size - 1, size - 1);
          }
        });
      });
    }

    function togglePause() {
      if (gameOver) return;
      paused = !paused;
      drawBoard();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'p' || e.key === 'P') {
        togglePause();
        return;
      }

      if (paused || gameOver) return;

      if (e.key === 'ArrowLeft') {
        moveHoriz(-1);
      } else if (e.key === 'ArrowRight') {
        moveHoriz(1);
      } else if (e.key === 'ArrowDown') {
        score += 1;
        moveDown();
        updateUI();
      } else if (e.key === 'ArrowUp') {
        rotateCurrent();
      } else if (e.key === ' ') {
        e.preventDefault();
        hardDrop();
      }
    });

    startBtn.addEventListener('click', () => {
      resetGame();
    });

    resetGame();
  </script>
</body>
</html>
