<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waterworks Factory</title>
<style>
:root{--bg:#08111f;--panel:#122137;--panel2:#172b45;--line:#315070;--text:#eaf4ff;--muted:#9db4ce;--blue:#57b5ff;--water:#2d9ee8;--green:#63e6a4;--gold:#ffd166;--red:#ff7676}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#1b3b5b,#08111f 63%);color:var(--text);font-family:system-ui,sans-serif}body{padding:12px;overflow:auto}.app{min-width:1060px;width:min(1500px,100%);margin:auto;display:grid;grid-template-columns:220px minmax(610px,1fr) 280px;gap:12px;padding:12px;border:1px solid #ffffff18;border-radius:16px;background:#091525e8;box-shadow:0 24px 70px #0008}.column{display:flex;flex-direction:column;gap:12px}.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid #ffffff13;border-radius:11px;padding:12px}.logo{font-weight:900;color:#80d5ff;letter-spacing:.08em}.sub,.hint,.small{font-size:11px;color:var(--muted);line-height:1.55}.title{margin:0 0 10px;font-size:13px;color:var(--blue);letter-spacing:.1em;text-transform:uppercase}.tools{display:flex;flex-direction:column;gap:7px}.tool{display:flex;align-items:center;text-align:left;gap:9px;background:#0b1728;border:1px solid var(--line);box-shadow:none;padding:9px}.tool.active{border-color:var(--green);background:#16374a;box-shadow:0 0 0 1px #63e6a444 inset}.tool:disabled{opacity:.45}.tool-icon{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;color:#07111f;font-weight:900}.tool-name{font-size:12px;font-weight:800}.tool-cost{font-size:10px;color:var(--muted);margin-top:2px}.board-head{height:34px;display:flex;gap:7px;align-items:center}.badge{font-size:11px;padding:5px 9px;border-radius:99px;background:#123b51;border:1px solid #57b5ff44;color:#93dcff}.badge.gold{color:var(--gold);background:#493911;border-color:#ffd16644}.badge.green{color:var(--green);background:#123d32;border-color:#63e6a444}canvas{width:100%;height:auto;display:block;border:2px solid #ffffff18;border-radius:10px;background:#091522;cursor:crosshair}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{background:#ffffff06;border:1px solid #ffffff0c;border-radius:8px;padding:7px}.stat label{display:block;color:var(--muted);font-size:10px}.stat b{font-size:17px}.info{font-size:12px;line-height:1.7;color:var(--muted);min-height:75px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}button{border:0;border-radius:8px;padding:9px;background:linear-gradient(#3d9cf0,#2166c7);color:#fff;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.1)}button.secondary{background:#20324a;border:1px solid #ffffff1a}button:disabled{opacity:.45;cursor:not-allowed}.skills{display:flex;flex-direction:column;gap:7px}.skill{display:flex;gap:7px;align-items:center;border:1px solid #ffffff0e;background:#ffffff05;border-radius:8px;padding:7px}.skill div{flex:1}.skill strong{font-size:11px}.skill small{display:block;color:var(--muted);font-size:10px}.skill button{padding:6px;font-size:10px;min-width:54px}.legend{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:10px;color:var(--muted)}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:4px}.log{height:72px;overflow:auto;font-size:10px;color:#b8cee5;border-top:1px solid #ffffff12;padding-top:7px}.log div{margin-bottom:3px}@media(max-width:1100px){body{align-items:flex-start}.app{grid-template-columns:195px minmax(580px,1fr) 240px}}
</style>
</head>
<body>
<div class="app">
  <aside class="column">
    <section class="panel"><div class="logo">WATERWORKS</div><div class="sub">水圧で動く資源工場</div></section>
    <section class="panel"><h2 class="title">機械を設置</h2><div class="tools" id="tools"></div><div class="hint" style="margin-top:9px">機械を選択して、マップをクリック。1〜4キーでも選べます。</div></section>
    <section class="panel"><h2 class="title">ルール</h2><div class="hint">ドリルは陸地に設置します。ポンプは水上に設置して水を供給します。ポンプから遠いドリルほど水圧が下がり、生産効率も下がります。</div></section>
    <section class="panel"><h2 class="title">凡例</h2><div class="legend"><span><i style="--c:#2d9ee8"></i>水源</span><span><i style="--c:#f5c45c"></i>資源候補</span><span><i style="--c:#61b6ff"></i>ドリル</span><span><i style="--c:#65e6a5"></i>ポンプ</span></div></section>
  </aside>
  <main class="column">
    <div class="board-head"><span class="badge green" id="cycle">CYCLE 1</span><span class="badge gold" id="goal">目標 1,000</span><span class="badge" id="selected">選択: ドリル</span></div>
    <canvas id="world" width="1100" height="650"></canvas>
  </main>
  <aside class="column">
    <section class="panel"><h2 class="title">資材</h2><div class="stats"><div class="stat"><label>鉄</label><b id="iron">80</b></div><div class="stat"><label>銅</label><b id="copper">50</b></div><div class="stat"><label>石炭</label><b id="coal">0</b></div><div class="stat"><label>石英</label><b id="quartz">0</b></div><div class="stat"><label>電力</label><b id="power">0</b></div><div class="stat"><label>部品</label><b id="parts">0</b></div></div></section>
    <section class="panel"><h2 class="title">水圧ネットワーク</h2><div class="info"><div>平均水圧: <b id="pressure">0%</b></div><div>稼働中ドリル: <b id="active">0</b></div><div>発見資材: <b id="found">なし</b></div><div id="message">まず水上にポンプを置こう。</div></div><div class="actions"><button class="secondary" id="advance">次のサイクル</button><button class="secondary" id="restart">再起動</button></div></section>
    <section class="panel"><h2 class="title">スキルツリー</h2><div class="skills" id="skills"></div></section>
    <section class="panel"><h2 class="title">ログ</h2><div class="log" id="log"></div></section>
  </aside>
</div>
<script>
const cv=document.getElementById('world'),ctx=cv.getContext('2d');
const CELL=50,COLS=22,ROWS=13,W=1100,H=650;
const machines={drill:{name:'ドリル',key:'1',color:'#61b6ff',cost:{iron:18,copper:8},desc:'陸地に置く。水圧で資材を掘る'},pump:{name:'流体ポンプ',key:'2',color:'#65e6a5',cost:{iron:25,copper:15},desc:'水上に置く。水圧の源になる'},belt:{name:'ベルトコンベア',key:'3',color:'#f6a85b',cost:{iron:12,copper:5},desc:'資材を運ぶライン'},chest:{name:'チェスト',key:'4',color:'#d899ff',cost:{iron:15,copper:8},desc:'近くの資材を保管する'}};
const skillDefs=[['pressure','高圧ポンプ','水圧の減衰を軽減',1],['drill','超硬ドリル','採掘量 +30%',1],['belt','高速ベルト','搬送範囲 +1',1],['luck','地質解析','レア資材の確率 +12%',2],['efficiency','節水機構','全ドリル効率 +20%',2],['master','工場主任','サイクル報酬アップ',3]];
const st={res:{iron:80,copper:50,coal:0,quartz:0,power:0,parts:0},cycle:1,score:0,prestige:0,sp:0,selected:'drill',skills:{},buildings:[],mouse:{x:0,y:0,over:false},ore:[{x:2,y:2},{x:5,y:9},{x:9,y:3},{x:14,y:8},{x:18,y:2},{x:20,y:10},{x:8,y:11},{x:12,y:5}],water:[{x:0,y:5},{x:1,y:5},{x:2,y:5},{x:3,y:5},{x:4,y:5},{x:5,y:5},{x:6,y:5},{x:7,y:5},{x:8,y:5},{x:9,y:5},{x:10,y:5},{x:11,y:5},{x:12,y:5},{x:13,y:5},{x:14,y:5},{x:15,y:5},{x:16,y:5},{x:17,y:5},{x:18,y:5},{x:19,y:5},{x:20,y:5},{x:21,y:5},{x:16,y:4},{x:16,y:6},{x:17,y:4},{x:17,y:6}]};
function fmt(n){return Math.floor(n).toLocaleString('ja-JP')}function hasWater(x,y){return st.water.some(w=>w.x===x&&w.y===y)}function owned(id){return!!st.skills[id]}function can(c){return Object.keys(c).every(k=>(st.res[k]||0)>=c[k])}function pay(c){Object.keys(c).forEach(k=>st.res[k]-=c[k])}function log(t){const el=document.getElementById('log');el.innerHTML=`<div>› ${t}</div>`+el.innerHTML}
function select(id){st.selected=id;document.getElementById('selected').textContent='選択: '+machines[id].name;document.getElementById('message').textContent=machines[id].desc+'。';renderTools()}
function renderTools(){const box=document.getElementById('tools');box.innerHTML='';Object.entries(machines).forEach(([id,m])=>{const b=document.createElement('button');b.className='tool '+(st.selected===id?'active':'');b.innerHTML=`<span class="tool-icon" style="background:${m.color}">${m.key}</span><span><div class="tool-name">${m.name}</div><div class="tool-cost">鉄 ${m.cost.iron} / 銅 ${m.cost.copper}</div></span>`;b.onclick=()=>select(id);box.appendChild(b)})}
function place(x,y){const type=st.selected,m=machines[type];if(st.buildings.some(b=>b.x===x&&b.y===y)){say('その場所には既に機械があります。');return}if(type==='pump'&&!hasWater(x,y)){say('流体ポンプは水上にしか置けません。');return}if(type==='drill'&&hasWater(x,y)){say('ドリルは陸地に置いてください。');return}if(!can(m.cost)){say('設置に必要な鉄・銅が足りません。');return}pay(m.cost);st.buildings.push({type,x,y,cd:0});log(m.name+'を設置');say(type==='pump'?'水圧が発生しました。':m.name+'を設置しました。');update();draw()}
function say(t){document.getElementById('message').textContent=t}
function pressureAt(x,y){const pumps=st.buildings.filter(b=>b.type==='pump');if(!pumps.length)return 0;let best=Infinity;pumps.forEach(p=>{const d=Math.abs(p.x-x)+Math.abs(p.y-y);best=Math.min(best,d)});let p=Math.max(0,1-best*.075);if(owned('pressure'))p=Math.min(1,p+.18);return p}
function drillYield(){let n=1;if(owned('drill'))n*=1.3;if(owned('efficiency'))n*=1.2;return n}
function resourceRoll(){const r=Math.random();const rare=owned('luck')?.12:.0;if(r<.46)return['iron',1];if(r<.78)return['copper',1];if(r<.93)return['coal',1];if(r<.93+rare)return['quartz',1];return['iron',1]}
function tick(){let active=0,total=0;st.buildings.forEach(b=>{b.cd-=owned('efficiency')?1.2:1;if(b.cd>0)return;if(b.type==='pump'){st.res.power+=2; b.cd=20;return}if(b.type==='drill'){const p=pressureAt(b.x,b.y);if(p<=0){b.cd=8;return}const [res,num]=resourceRoll();const amount=num*p*drillYield();st.res[res]+=amount;st.score+=amount*5;active++;total+=p;b.cd=Math.max(8,26/(1+(owned('drill')?.3:0)))}if(b.type==='belt'){b.cd=25/(owned('belt')?1.4:1);st.score+=1}if(b.type==='chest'){b.cd=30;st.res.parts+=.5}});const avg=active?total/active:0;document.getElementById('pressure').textContent=Math.round(avg*100)+'%';document.getElementById('active').textContent=active;document.getElementById('found').textContent=active?Object.entries(st.res).filter(([k,v])=>['coal','quartz'].includes(k)&&v>0).map(([k])=>k==='coal'?'石炭':'石英').join('・')||'鉄・銅':'なし';st.res.power=Math.max(0,st.res.power-st.buildings.filter(b=>b.type==='drill').length*.03);update()}
function renderSkills(){const box=document.getElementById('skills');box.innerHTML='';skillDefs.forEach(([id,n,d,c])=>{const row=document.createElement('div');row.className='skill';const b=document.createElement('button');b.textContent=owned(id)?'取得済':c+' SP';b.disabled=owned(id)||st.sp<c;if(!owned(id))b.onclick=()=>{st.sp-=c;st.skills[id]=true;log(n+'を取得');say(n+'を取得しました。');update()};row.innerHTML=`<div><strong>${n}</strong><small>${d}</small></div>`;row.appendChild(b);box.appendChild(row)})}
function update(){['iron','copper','coal','quartz','power','parts'].forEach(k=>document.getElementById(k).textContent=fmt(st.res[k]));document.getElementById('score').textContent=fmt(st.score);document.getElementById('sp').textContent=st.sp;document.getElementById('cycle').textContent='CYCLE '+st.cycle;document.getElementById('goal').textContent='目標 '+fmt(1000+st.prestige*300);renderSkills();renderTools()}
function draw(){ctx.clearRect(0,0,W,H);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const water=hasWater(x,y);ctx.fillStyle=water?'#155b88':(x+y)%2?'#142a3d':'#172f46';ctx.fillRect(x*CELL,y*CELL,CELL,CELL);ctx.strokeStyle=water?'#55c9ff44':'#ffffff0b';ctx.strokeRect(x*CELL,y*CELL,CELL,CELL);if(water){ctx.fillStyle='#52c9ff66';ctx.fillRect(x*CELL+7,y*CELL+22,36,3)}}st.ore.forEach(o=>{if(st.buildings.some(b=>b.type==='drill'&&b.x===o.x&&b.y===o.y))return;ctx.fillStyle='#f5c45c';ctx.beginPath();ctx.arc(o.x*CELL+25,o.y*CELL+25,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4b3510';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText('?',o.x*CELL+25,o.y*CELL+29)});st.buildings.forEach(b=>{const m=machines[b.type],x=b.x*CELL+5,y=b.y*CELL+5;ctx.fillStyle=m.color;ctx.fillRect(x,y,40,40);ctx.fillStyle='#061321';ctx.font='bold 17px sans-serif';ctx.textAlign='center';ctx.fillText(m.key,x+20,y+26);if(b.type==='drill'){const p=pressureAt(b.x,b.y);ctx.fillStyle='#07111fcc';ctx.fillRect(x,y+34,40,6);ctx.fillStyle=p>.5?'#63e6a4':p?'#ffd166':'#ff7676';ctx.fillRect(x,y+34,40*p,6)}});if(st.mouse.over){const x=Math.floor(st.mouse.x/CELL),y=Math.floor(st.mouse.y/CELL);if(x>=0&&x<COLS&&y>=0&&y<ROWS){ctx.strokeStyle='#63e6a4';ctx.lineWidth=3;ctx.strokeRect(x*CELL+2,y*CELL+2,CELL-4,CELL-4);if(st.selected==='drill'&&!hasWater(x,y)){ctx.fillStyle='#ffffffaa';ctx.font='11px sans-serif';ctx.fillText(Math.round(pressureAt(x,y)*100)+'% 水圧',x*CELL+4,y*CELL+14)}}}}
function mouse(e){const r=cv.getBoundingClientRect();st.mouse={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height,over:true};return{x:Math.floor(st.mouse.x/CELL),y:Math.floor(st.mouse.y/CELL)}}
cv.onmousemove=e=>{mouse(e);draw()};cv.onmouseleave=()=>{st.mouse.over=false;draw()};cv.onclick=e=>{const p=mouse(e);if(p.x>=0&&p.x<COLS&&p.y>=0&&p.y<ROWS)place(p.x,p.y)};
function advance(){st.cycle++;st.sp+=owned('master')?2:1;st.score+=100+st.cycle*20+(owned('master')?100:0);say('サイクルを進めました。スキルポイント獲得。');log('サイクル '+st.cycle+' 開始');update()}
function restart(){const gain=Math.max(1,Math.floor(st.score/500));st.prestige+=gain;st.cycle=1;st.score=0;st.res={iron:80+st.prestige*15,copper:50+st.prestige*8,coal:0,quartz:0,power:0,parts:0};st.buildings=[];say('工場を再起動。威信が恒久的に増えました。');log('再起動: 威信 +'+gain);update();draw()}
document.getElementById('advance').onclick=advance;document.getElementById('restart').onclick=restart;document.addEventListener('keydown',e=>{const id=Object.keys(machines).find(k=>machines[k].key===e.key);if(id)select(id);if(e.key.toLowerCase()==='a')advance();if(e.key.toLowerCase()==='r')restart()});renderTools();update();draw();setInterval(()=>{tick();draw()},1000);
</script>
</body>
</html>
