<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waterworks Factory</title>
  <style>
    :root {
      --bg: #08111f;
      --panel: #122137;
      --panel2: #172b45;
      --line: #315070;
      --text: #eaf4ff;
      --muted: #9db4ce;
      --blue: #57b5ff;
      --water: #2d9ee8;
      --green: #63e6a4;
      --gold: #ffd166;
      --red: #ff7676;
      --pink: #d899ff;
      --amber: #f6a85b;
      --ink: #071521;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at top, #1b3b5b, #08111f 63%);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }
    body { padding: 12px; overflow: auto; }

    .app {
      min-width: 1100px;
      width: min(1500px, 100%);
      margin: auto;
      display: grid;
      grid-template-columns: 220px minmax(610px, 1fr) 280px;
      gap: 12px;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(9, 21, 37, 0.92);
      box-shadow: 0 24px 70px rgba(0,0,0,.55);
    }

    .column { display: flex; flex-direction: column; gap: 12px; }
    .panel {
      background: linear-gradient(180deg, var(--panel2), var(--panel));
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 11px;
      padding: 12px;
    }
    .logo { font-weight: 900; color: #80d5ff; letter-spacing: .08em; }
    .sub, .hint, .small { font-size: 11px; color: var(--muted); line-height: 1.55; }
    .title { margin: 0 0 10px; font-size: 13px; color: var(--blue); letter-spacing: .1em; text-transform: uppercase; }

    .tools { display: flex; flex-direction: column; gap: 7px; }
    .tool {
      display: flex; align-items: center; text-align: left; gap: 9px;
      width: 100%; background: #0b1728; border: 1px solid var(--line);
      padding: 9px; border-radius: 8px; cursor: pointer; color: var(--text);
    }
    .tool.active {
      border-color: var(--green);
      background: #16374a;
      box-shadow: inset 0 0 0 1px rgba(99, 230, 164, .35);
    }
    .tool-icon {
      width: 32px; height: 32px; border-radius: 7px; display: grid; place-items: center;
      color: #07111f; font-weight: 900; flex: 0 0 auto;
    }
    .tool-name { font-size: 12px; font-weight: 800; }
    .tool-cost { font-size: 10px; color: var(--muted); margin-top: 2px; }

    .board-head {
      height: 34px; display: flex; align-items: center; gap: 7px; margin: 2px 2px 9px;
    }
    .badge {
      display: inline-block; font-size: 11px; padding: 5px 9px; border-radius: 99px;
      background: #123b51; border: 1px solid rgba(87, 181, 255, 0.25); color: #93dcff;
    }
    .badge.gold { color: var(--gold); background: #493911; border-color: rgba(255, 209, 102, 0.25); }
    .badge.green { color: var(--green); background: #123d32; border-color: rgba(99, 230, 164, 0.25); }

    canvas {
      display: block; width: 100%; height: auto; border: 2px solid rgba(255,255,255,.12);
      border-radius: 10px; background: #091522; cursor: crosshair;
    }

    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .stat {
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px; padding: 7px;
    }
    .stat label { display: block; color: var(--muted); font-size: 10px; }
    .stat b { font-size: 17px; }

    .info { font-size: 12px; line-height: 1.7; color: var(--muted); min-height: 75px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    button {
      border: 0; border-radius: 8px; padding: 9px;
      background: linear-gradient(#3d9cf0, #2166c7); color: #fff; font-weight: 800; cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    button.secondary {
      background: #20324a; border: 1px solid rgba(255,255,255,.13);
    }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .skills { display: flex; flex-direction: column; gap: 7px; }
    .skill {
      display: flex; align-items: center; gap: 7px; padding: 7px; border-radius: 8px;
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
    }
    .skill div { flex: 1; }
    .skill strong { font-size: 11px; }
    .skill small { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; }
    .skill button { padding: 6px; font-size: 10px; min-width: 54px; }

    .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 10px; color: var(--muted); }
    .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; background: var(--c); }

    .log {
      height: 72px; overflow: auto; font-size: 10px; color: #b8cee5;
      border-top: 1px solid rgba(255,255,255,.08); padding-top: 7px;
    }
    .log div { margin-bottom: 3px; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="column">
      <section class="panel">
        <div class="logo">WATERWORKS</div>
        <div class="sub">水圧で動く資源工場</div>
      </section>

      <section class="panel">
        <h2 class="title">機械を設置</h2>
        <div class="tools" id="tools"></div>
        <div class="hint" style="margin-top:9px;">機械を選択して、マップをクリック。1〜4キーでも選べます。</div>
      </section>

      <section class="panel">
        <h2 class="title">ルール</h2>
        <div class="hint">
          ドリルは陸地に置く。流体ポンプは川や水溜まりに置いて水圧を発生させる。水源から離れるほど圧力が落ち、ドリルの生産効率も低下する。
        </div>
      </section>

      <section class="panel">
        <h2 class="title">凡例</h2>
        <div class="legend">
          <span><i style="--c:#2d9ee8"></i>水源</span>
          <span><i style="--c:#f5c45c"></i>資源層</span>
          <span><i style="--c:#61b6ff"></i>ドリル</span>
          <span><i style="--c:#65e6a5"></i>ポンプ</span>
        </div>
      </section>
    </aside>

    <main class="column">
      <div class="board-head">
        <span class="badge green" id="cycle">CYCLE 1</span>
        <span class="badge gold" id="goal">目標 1,000</span>
        <span class="badge" id="selected">選択: ドリル</span>
      </div>
      <canvas id="world" width="1100" height="650"></canvas>
    </main>

    <aside class="column">
      <section class="panel">
        <h2 class="title">資材</h2>
        <div class="stats">
          <div class="stat"><label>鉄</label><b id="iron">80</b></div>
          <div class="stat"><label>銅</label><b id="copper">50</b></div>
          <div class="stat"><label>石炭</label><b id="coal">0</b></div>
          <div class="stat"><label>石英</label><b id="quartz">0</b></div>
          <div class="stat"><label>電力</label><b id="power">0</b></div>
          <div class="stat"><label>部品</label><b id="parts">0</b></div>
        </div>
      </section>

      <section class="panel">
        <h2 class="title">水圧ネットワーク</h2>
        <div class="info">
          <div>平均水圧: <b id="pressure">0%</b></div>
          <div>稼働中ドリル: <b id="active">0</b></div>
          <div>発見資材: <b id="found">なし</b></div>
          <div id="message">まず水上にポンプを置こう。</div>
        </div>
        <div class="actions">
          <button class="secondary" id="advance">次のサイクル</button>
          <button class="secondary" id="restart">再起動</button>
        </div>
      </section>

      <section class="panel">
        <h2 class="title">スキルツリー</h2>
        <div class="skills" id="skills"></div>
      </section>

      <section class="panel">
        <h2 class="title">ログ</h2>
        <div class="log" id="log"></div>
      </section>
    </aside>
  </div>

  <script>
    const cv = document.getElementById('world');
    const ctx = cv.getContext('2d');
    const CELL = 50;
    const COLS = 22;
    const ROWS = 13;
    const W = 1100;
    const H = 650;

    const machines = {
      drill: { name: 'ドリル', key: '1', color: '#61b6ff', cost: { iron: 20, copper: 10 }, desc: '陸地に置いて水圧で資材を掘る' },
      pump: { name: '流体ポンプ', key: '2', color: '#65e6a5', cost: { iron: 25, copper: 15 }, desc: '川や水溜まりに置いて圧力を作る' },
      belt: { name: 'ベルトコンベア', key: '3', color: '#f6a85b', cost: { iron: 12, copper: 6 }, desc: 'ドリルとチェストの運搬効率を上げる' },
      chest: { name: 'チェスト', key: '4', color: '#d899ff', cost: { iron: 15, copper: 10 }, desc: '採れた資材を保管する' }
    };

    const skillDefs = [
      ['pressure', '高圧ポンプ', '水圧の減衰を軽減', 1],
      ['drill', '超硬ドリル', '採掘量 +30%', 1],
      ['belt', '高速ベルト', '運搬効率 +25%', 1],
      ['luck', '地質解析', 'レア資材の確率 +12%', 2],
      ['efficiency', '節水機構', '全ドリル効率 +20%', 2],
      ['master', '工場主任', 'サイクル報酬アップ', 3]
    ];

    const state = {
      res: { iron: 80, copper: 50, coal: 0, quartz: 0, power: 0, parts: 0 },
      cycle: 1,
      score: 0,
      prestige: 0,
      sp: 0,
      selected: 'drill',
      skills: {},
      buildings: [],
      mouse: { x: 0, y: 0, over: false },
      water: [
        { x: 0, y: 5 }, { x: 1, y: 5 }, { x: 2, y: 5 }, { x: 3, y: 5 }, { x: 4, y: 5 },
        { x: 5, y: 5 }, { x: 6, y: 5 }, { x: 7, y: 5 }, { x: 8, y: 5 }, { x: 9, y: 5 },
        { x: 10, y: 5 }, { x: 11, y: 5 }, { x: 12, y: 5 }, { x: 13, y: 5 }, { x: 14, y: 5 },
        { x: 15, y: 5 }, { x: 16, y: 5 }, { x: 17, y: 5 }, { x: 18, y: 5 }, { x: 19, y: 5 },
        { x: 20, y: 5 }, { x: 21, y: 5 }, { x: 16, y: 4 }, { x: 16, y: 6 }, { x: 17, y: 4 }, { x: 17, y: 6 }
      ],
      ore: [
        { x: 2, y: 2, amount: 30, kind: 'iron' },
        { x: 5, y: 9, amount: 35, kind: 'iron' },
        { x: 9, y: 3, amount: 30, kind: 'copper' },
        { x: 14, y: 8, amount: 35, kind: 'copper' },
        { x: 18, y: 2, amount: 28, kind: 'coal' },
        { x: 20, y: 10, amount: 32, kind: 'coal' },
        { x: 8, y: 11, amount: 30, kind: 'quartz' },
        { x: 12, y: 5, amount: 34, kind: 'quartz' }
      ]
    };

    function fmt(n) { return Math.floor(n).toLocaleString('ja-JP'); }
    function log(msg) {
      const box = document.getElementById('log');
      box.innerHTML = `<div>› ${msg}</div>` + box.innerHTML;
    }
    function say(msg) {
      document.getElementById('message').textContent = msg;
    }
    function owned(id) {
      return !!state.skills[id];
    }
    function canAfford(cost) {
      return Object.keys(cost).every(k => (state.res[k] || 0) >= cost[k]);
    }
    function pay(cost) {
      Object.keys(cost).forEach(k => state.res[k] -= cost[k]);
    }
    function hasWater(x, y) {
      return state.water.some(w => w.x === x && w.y === y);
    }

    function renderTools() {
      const box = document.getElementById('tools');
      box.innerHTML = '';
      Object.entries(machines).forEach(([id, m]) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tool' + (state.selected === id ? ' active' : '');
        btn.innerHTML = `
          <span class="tool-icon" style="background:${m.color}">${m.key}</span>
          <span>
            <div class="tool-name">${m.name}</div>
            <div class="tool-cost">鉄 ${m.cost.iron} / 銅 ${m.cost.copper}</div>
          </span>
        `;
        btn.onclick = () => selectMachine(id);
        box.appendChild(btn);
      });
    }

    function selectMachine(id) {
      state.selected = id;
      document.getElementById('selected').textContent = '選択: ' + machines[id].name;
      document.getElementById('message').textContent = machines[id].desc + '。';
      renderTools();
    }

    function nearestPumpDistance(x, y) {
      const pumps = state.buildings.filter(b => b.type === 'pump');
      if (!pumps.length) return Infinity;
      let best = Infinity;
      for (const p of pumps) {
        const d = Math.abs(p.x - x) + Math.abs(p.y - y);
        if (d < best) best = d;
      }
      return best;
    }

    function pressureAt(x, y) {
      const nearest = nearestPumpDistance(x, y);
      if (!Number.isFinite(nearest)) return 0;
      // 水に接していないと圧力がほぼゼロ
      const waterTouch = hasWater(x, y) ||
        state.water.some(w => Math.abs(w.x - x) + Math.abs(w.y - y) === 1);
      if (!waterTouch) return 0;

      let p = Math.max(0, 1 - nearest * 0.17);
      if (owned('pressure')) p += 0.15;
      return Math.min(1, Math.max(0, p));
    }

    function resourceRoll() {
      const r = Math.random();
      const rare = owned('luck') ? 0.12 : 0;

      if (r < 0.46) return 'iron';
      if (r < 0.76) return 'copper';
      if (r < 0.9) return 'coal';
      if (r < 0.9 + rare) return 'quartz';
      return 'iron';
    }

    function placeBuilding(x, y) {
      const type = state.selected;
      const info = machines[type];

      if (state.buildings.some(b => b.x === x && b.y === y)) {
        say('その場所には既に機械があります。');
        return;
      }

      if (type === 'pump' && !hasWater(x, y)) {
        say('流体ポンプは川や水溜まりに置いてください。');
        return;
      }

      if (type === 'drill' && hasWater(x, y)) {
        say('ドリルは陸地に置いてください。');
        return;
      }

      if (!canAfford(info.cost)) {
        say('必要な資源が足りません。');
        return;
      }

      pay(info.cost);
      state.buildings.push({ type, x, y, cd: 0 });
      log(info.name + 'を設置');
      say(info.name + 'を設置しました。');
      updateUI();
      draw();
    }

    function drillEffect() {
      let active = 0;
      let totalPressure = 0;

      state.buildings.forEach(b => {
        if (b.type !== 'drill') return;
        const p = pressureAt(b.x, b.y);
        if (p <= 0) return;

        const deposit = state.ore.filter(o => Math.abs(o.x - b.x) <= 1 && Math.abs(o.y - b.y) <= 1 && o.amount > 0)[0];
        if (!deposit) return;

        const multi = owned('drill') ? 1.3 : 1;
        const eff = owned('efficiency') ? 1.2 : 1;
        const chance = Math.min(1, p * 0.9 * multi * eff);

        if (Math.random() < chance) {
          const type = deposit.kind; // 置かれた資源層の性質を優先
          state.res[type] += 1 + (owned('drill') ? 1 : 0);
          deposit.amount -= 1;
          state.score += 12;
          active += 1;
          totalPressure += p;
        }
      });

      const avg = active ? totalPressure / active : 0;
      document.getElementById('pressure').textContent = Math.round(avg * 100) + '%';
      document.getElementById('active').textContent = active;

      if (active > 0) {
        const found = Object.entries(state.res)
          .filter(([k, v]) => ['coal', 'quartz'].includes(k) && v > 0)
          .map(([k]) => k === 'coal' ? '石炭' : '石英')
          .join('・') || '鉄・銅';
        document.getElementById('found').textContent = found;
      } else {
        document.getElementById('found').textContent = 'なし';
      }
    }

    function tick() {
      state.buildings.forEach(b => {
        if (b.type === 'pump') {
          state.res.power += 2 + (owned('pressure') ? 1 : 0);
          b.cd = 16;
        }

        if (b.type === 'belt') {
          state.score += 1;
          b.cd = 24;
        }

        if (b.type === 'chest') {
          state.res.parts += 0.2;
          b.cd = 28;
        }
      });

      if (state.buildings.some(b => b.type === 'drill')) {
        drillEffect();
      } else {
        document.getElementById('pressure').textContent = '0%';
        document.getElementById('active').textContent = 0;
        document.getElementById('found').textContent = 'なし';
      }

      state.res.power = Math.max(0, state.res.power - state.buildings.filter(b => b.type !== 'pump').length * 0.02);
      if (state.buildings.some(b => b.type === 'belt')) {
        const beltBoost = (state.buildings.filter(b => b.type === 'belt').length * 0.1) + (owned('belt') ? 0.15 : 0);
        state.res.parts += beltBoost;
      }

      updateUI();
    }

    function renderSkills() {
      const box = document.getElementById('skills');
      box.innerHTML = '';

      skillDefs.forEach(([id, name, desc, cost]) => {
        const row = document.createElement('div');
        row.className = 'skill';

        const info = document.createElement('div');
        info.innerHTML = `<strong>${name}</strong><small>${desc}</small>`;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = owned(id) ? '取得済' : cost + ' SP';
        btn.disabled = owned(id) || state.sp < cost;
        btn.onclick = () => {
          if (state.sp < cost) return;
          state.sp -= cost;
          state.skills[id] = true;
          say(name + ' を取得した。');
          log(name + 'を取得');
          updateUI();
        };

        row.appendChild(info);
        row.appendChild(btn);
        box.appendChild(row);
      });
    }

    function updateUI() {
      const keys = ['iron', 'copper', 'coal', 'quartz', 'power', 'parts'];
      keys.forEach(k => {
        const el = document.getElementById(k);
        if (el) el.textContent = fmt(state.res[k]);
      });

      document.getElementById('cycle').textContent = 'CYCLE ' + state.cycle;
      document.getElementById('goal').textContent = '目標 ' + fmt(1000 + state.prestige * 300);
      document.getElementById('selected').textContent = '選択: ' + machines[state.selected].name;
      document.getElementById('score').textContent = 'score';
      // legacy UI uses no score element here, so we ignore it.
      document.getElementById('power').textContent = fmt(state.res.power);
      renderSkills();
      renderTools();
    }

    function advanceCycle() {
      state.cycle += 1;
      state.sp += 1 + (owned('master') ? 1 : 0);
      state.score += 100 + state.cycle * 20 + (owned('master') ? 150 : 0);
      say('次のサイクルへ。スキルポイントを獲得した。');
      log('サイクル ' + state.cycle + ' 開始');
      updateUI();
    }

    function restartGame() {
      const gain = Math.max(1, Math.floor(state.score / 500));
      state.prestige += gain;
      state.cycle = 1;
      state.score = 0;
      state.res = { iron: 80 + state.prestige * 15, copper: 50 + state.prestige * 8, coal: 0, quartz: 0, power: 0, parts: 0 };
      state.buildings = [];
      say('工場を再起動。威信+' + gain + '。');
      log('再起動: 威信 +' + gain);
      updateUI();
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const water = hasWater(x, y);
          ctx.fillStyle = water ? '#155b88' : ((x + y) % 2 ? '#142a3d' : '#172f46');
          ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
          ctx.strokeStyle = water ? 'rgba(85, 201, 255, 0.25)' : 'rgba(255,255,255,0.08)';
          ctx.strokeRect(x * CELL, y * CELL, CELL, CELL);

          if (water) {
            ctx.fillStyle = 'rgba(82,201,255,0.55)';
            ctx.fillRect(x * CELL + 7, y * CELL + 22, 36, 3);
          }
        }
      }

      for (const o of state.ore) {
        const exists = state.buildings.some(b => b.type === 'drill' && b.x === o.x && b.y === o.y);
        if (exists || o.amount <= 0) continue;
        ctx.fillStyle = o.kind === 'iron' ? '#f5c45c' : o.kind === 'copper' ? '#ffd166' : o.kind === 'coal' ? '#7c8fa8' : '#d9d3ff';
        ctx.beginPath();
        ctx.arc(o.x * CELL + 25, o.y * CELL + 25, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#381e00';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('?', o.x * CELL + 25, o.y * CELL + 29);
      }

      state.buildings.forEach(b => {
        const m = machines[b.type];
        const x = b.x * CELL + 5;
        const y = b.y * CELL + 5;
        ctx.fillStyle = m.color;
        ctx.fillRect(x, y, 40, 40);
        ctx.fillStyle = '#07111f';
        ctx.font = 'bold 17px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(m.key, x + 20, y + 27);

        if (b.type === 'drill') {
          const p = pressureAt(b.x, b.y);
          ctx.fillStyle = 'rgba(7,17,31,0.8)';
          ctx.fillRect(x, y + 34, 40, 6);
          ctx.fillStyle = p > 0.65 ? '#63e6a4' : p > 0.3 ? '#ffd166' : '#ff7676';
          ctx.fillRect(x, y + 34, 40 * p, 6);
        }
      });

      if (state.mouse.over) {
        const gx = Math.floor(state.mouse.x / CELL);
        const gy = Math.floor(state.mouse.y / CELL);
        if (gx >= 0 && gx < COLS && gy >= 0 && gy < ROWS) {
          ctx.strokeStyle = '#63e6a4';
          ctx.lineWidth = 3;
          ctx.strokeRect(gx * CELL + 2, gy * CELL + 2, CELL - 4, CELL - 4);
          if (state.selected === 'drill') {
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.font = '11px sans-serif';
            ctx.fillText(Math.round(pressureAt(gx, gy) * 100) + '% 水圧', gx * CELL + 4, gy * CELL + 14);
          }
        }
      }
    }

    function mousePos(e) {
      const rect = cv.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (W / rect.width);
      const y = (e.clientY - rect.top) * (H / rect.height);
      state.mouse = { x, y, over: true };
      return { x: Math.floor(x / CELL), y: Math.floor(y / CELL) };
    }

    cv.addEventListener('mousemove', e => {
      mousePos(e);
      draw();
    });
    cv.addEventListener('mouseleave', () => {
      state.mouse.over = false;
      draw();
    });
    cv.addEventListener('click', e => {
      const p = mousePos(e);
      if (p.x >= 0 && p.x < COLS && p.y >= 0 && p.y < ROWS) {
        placeBuilding(p.x, p.y);
      }
    });

    document.addEventListener('keydown', e => {
      const ids = Object.keys(machines);
      const keyId = ids.find(id => machines[id].key === e.key);
      if (keyId) selectMachine(keyId);
      if (e.key.toLowerCase() === 'a') advanceCycle();
      if (e.key.toLowerCase() === 'r') restartGame();
    });

    document.getElementById('advance').onclick = advanceCycle;
    document.getElementById('restart').onclick = restartGame;

    renderTools();
    renderSkills();
    updateUI();
    draw();
    setInterval(() => {
      tick();
      draw();
    }, 1000);
  </script>
</body>
</html>
