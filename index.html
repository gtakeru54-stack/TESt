<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Factory Ascension - 横画面工場</title>
<style>
:root{--bg:#09111f;--panel:#111d31;--panel2:#17263d;--line:#2b4261;--text:#edf6ff;--muted:#9db2cd;--blue:#48a9ff;--green:#63e6a4;--gold:#ffd166;--red:#ff7777}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#1c3554,#09111f 60%);color:var(--text);font-family:system-ui,sans-serif}body{padding:14px;overflow-x:auto}.app{width:min(1500px,100%);min-width:1040px;margin:auto;display:grid;grid-template-columns:220px minmax(600px,1fr) 270px;gap:12px;background:#0b1423dd;border:1px solid #ffffff18;border-radius:16px;padding:12px;box-shadow:0 20px 60px #0008}.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid #ffffff12;border-radius:11px;padding:12px}.leftbar,.rightbar{display:flex;flex-direction:column;gap:12px}.logo{font-weight:900;letter-spacing:.08em;color:#7dd3fc;font-size:18px}.sub{font-size:11px;color:var(--muted);margin-top:3px}.title{margin:0 0 10px;color:var(--blue);font-size:13px;letter-spacing:.1em;text-transform:uppercase}.machine-list{display:flex;flex-direction:column;gap:8px}.machine{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px;background:#0c1728;border:1px solid var(--line);box-shadow:none}.machine.selected{border-color:var(--green);box-shadow:0 0 0 1px #63e6a455 inset;background:#18344a}.machine:disabled{opacity:.45;cursor:not-allowed}.icon{width:32px;height:32px;display:grid;place-items:center;border-radius:7px;color:#07111f;font-weight:900;font-size:14px}.machine-name{font-size:12px;font-weight:800}.cost{font-size:10px;color:var(--muted);margin-top:2px}.help{font-size:11px;color:var(--muted);line-height:1.6}.board-wrap{min-width:0}.topline{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 9px;gap:8px}.badge{padding:5px 9px;border-radius:99px;background:#123a4d;color:var(--green);font-size:11px;border:1px solid #63e6a444}.badge.goal{color:var(--gold);background:#493812;border-color:#ffd16644}canvas{display:block;width:100%;height:auto;aspect-ratio:1100/650;background:#0a1422;border:2px solid #ffffff17;border-radius:10px;cursor:crosshair}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{padding:8px;background:#ffffff06;border:1px solid #ffffff0c;border-radius:8px}.stat label{font-size:10px;color:var(--muted);display:block}.stat b{font-size:17px}.status{font-size:12px;line-height:1.6;color:var(--muted);min-height:55px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}button{border:0;border-radius:8px;padding:9px;background:linear-gradient(#3d96ee,#2165c5);color:#fff;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.1)}button.secondary{background:#1d2c42;border:1px solid #ffffff18}button:disabled{opacity:.45;cursor:not-allowed}.skills{display:flex;flex-direction:column;gap:7px}.skill{display:flex;align-items:center;gap:7px;padding:7px;background:#ffffff05;border:1px solid #ffffff0d;border-radius:8px}.skill div{flex:1}.skill strong{font-size:11px}.skill small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.skill button{padding:6px 7px;font-size:10px;min-width:54px}.legend{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:10px;color:var(--muted)}.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c)}@media(max-width:1080px){body{align-items:flex-start}.app{grid-template-columns:190px minmax(570px,1fr) 235px;min-width:995px}}
</style>
</head>
<body>
<div class="app">
  <aside class="leftbar">
    <div class="panel"><div class="logo">FACTORY//ASCENSION</div><div class="sub">機械を配置して工場を拡張</div></div>
    <div class="panel">
      <h2 class="title">機械を選択</h2>
      <div class="machine-list" id="machineList"></div>
      <div class="help" style="margin-top:10px">機械を選んでから、中央のマップをクリックして設置。キー 1〜4 でも選択できます。</div>
    </div>
    <div class="panel"><h2 class="title">マップ凡例</h2><div class="legend"><span style="--c:#4d9cff">鉄鉱脈</span><span style="--c:#ffd166">銅鉱脈</span><span style="--c:#58d68d">発電所</span><span style="--c:#ff8a65">加工機</span></div></div>
  </aside>

  <main class="board-wrap">
    <div class="topline"><span class="badge" id="cycle">CYCLE 1</span><span class="badge goal" id="goal">目標 2,000</span><span class="badge" id="selected">選択: 採掘機</span></div>
    <canvas id="world" width="1100" height="650"></canvas>
  </main>

  <aside class="rightbar">
    <section class="panel"><h2 class="title">資源</h2><div class="stats">
      <div class="stat"><label>鉄</label><b id="iron">120</b></div><div class="stat"><label>銅</label><b id="copper">60</b></div><div class="stat"><label>電力</label><b id="power">30</b></div><div class="stat"><label>部品</label><b id="parts">0</b></div>
    </div></section>
    <section class="panel"><h2 class="title">工場情報</h2><div class="status"><div>スコア: <b id="score">0</b></div><div>威信: <b id="prestige">0</b></div><div>スキルポイント: <b id="sp">0</b></div><div id="message">鉱脈の隣に採掘機を置こう。</div></div><div class="actions"><button class="secondary" id="advance">次のサイクル</button><button class="secondary" id="ascend">再起動</button></div></section>
    <section class="panel"><h2 class="title">スキルツリー</h2><div class="skills" id="skills"></div></section>
  </aside>
</div>
<script>
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');
const W=1100,H=650,CELL=50,COLS=22,ROWS=13;
const defs={miner:{name:'採掘機',key:'1',cost:{iron:25,copper:12},color:'#4d9cff',desc:'鉱脈から鉄を掘る'},smelter:{name:'精錬炉',key:'2',cost:{iron:40,copper:24},color:'#ff8a65',desc:'鉄を部品へ加工'},generator:{name:'発電所',key:'3',cost:{iron:30,copper:18},color:'#58d68d',desc:'電力を生み出す'},assembler:{name:'組立機',key:'4',cost:{iron:55,copper:35},color:'#d98cff',desc:'部品を大量生産'}};
const skillDefs=[['mine','採掘効率','採掘量 +25%',1],['smelt','精錬技術','精錬量 +30%',1],['power','送電網','発電量 +35%',1],['speed','自動化','機械の速度 +30%',1],['chain','物流最適化','全生産 +15%',2],['drone','ドローン班','サイクル報酬アップ',2]];
const s={res:{iron:120,copper:60,power:30,parts:0},score:0,cycle:1,prestige:0,sp:0,selected:'miner',skills:{},buildings:[],mouse:{x:0,y:0,over:false},ore:[
{x:2,y:2,t:'iron',amount:30},{x:5,y:8,t:'iron',amount:35},{x:10,y:3,t:'copper',amount:30},{x:15,y:9,t:'copper',amount:35},{x:18,y:3,t:'iron',amount:28},{x:20,y:10,t:'copper',amount:32},{x:8,y:11,t:'iron',amount:30},{x:13,y:6,t:'copper',amount:35}]};
function fmt(n){return Math.floor(n).toLocaleString('ja-JP')}function afford(c){return Object.keys(c).every(k=>s.res[k]>=c[k])}function spend(c){Object.keys(c).forEach(k=>s.res[k]-=c[k])}function mult(type){let n=1;if(s.skills.chain)n*=1.15;if(type==='miner'&&s.skills.mine)n*=1.25;if(type==='smelter'&&s.skills.smelt)n*=1.3;if(type==='generator'&&s.skills.power)n*=1.35;return n}function speed(){return s.skills.speed?1.3:1}
function makeMachineButtons(){const box=document.getElementById('machineList');box.innerHTML='';Object.entries(defs).forEach(([id,d])=>{const b=document.createElement('button');b.className='machine '+(s.selected===id?'selected':'');b.dataset.machine=id;b.innerHTML=`<span class="icon" style="background:${d.color}">${d.key}</span><span><div class="machine-name">${d.name}</div><div class="cost">鉄 ${d.cost.iron} / 銅 ${d.cost.copper}</div></span>`;b.onclick=()=>selectMachine(id);box.appendChild(b)})}
function selectMachine(id){s.selected=id;document.getElementById('selected').textContent='選択: '+defs[id].name;document.getElementById('message').textContent=defs[id].desc+'。マップをクリックして設置。';makeMachineButtons()}
function place(gx,gy){if(s.buildings.some(b=>b.x===gx&&b.y===gy)){msg('そのマスには既に機械があります。');return}const d=defs[s.selected];if(!afford(d.cost)){msg('資源が足りません。');return}spend(d.cost);s.buildings.push({type:s.selected,x:gx,y:gy,cd:0});msg(`${d.name}を設置しました。`);draw()}
function msg(t){document.getElementById('message').textContent=t}
function renderSkills(){const box=document.getElementById('skills');box.innerHTML='';skillDefs.forEach(([id,name,desc,cost])=>{const row=document.createElement('div');row.className='skill';const owned=s.skills[id];row.innerHTML=`<div><strong>${name}</strong><small>${desc}</small></div><button ${owned||s.sp<cost?'disabled':''}>${owned?'取得済':cost+' SP'}</button>`;if(!owned)row.querySelector('button').onclick=()=>{if(s.sp>=cost){s.sp-=cost;s.skills[id]=true;msg(name+'を取得しました。');update()}};box.appendChild(row)})}
function update(){for(const k of ['iron','copper','power','parts'])document.getElementById(k).textContent=fmt(s.res[k]);document.getElementById('score').textContent=fmt(s.score);document.getElementById('prestige').textContent=s.prestige;document.getElementById('sp').textContent=s.sp;document.getElementById('cycle').textContent='CYCLE '+s.cycle;document.getElementById('goal').textContent='目標 '+fmt(2000+s.prestige*250);renderSkills();makeMachineButtons()}
function tick(){s.buildings.forEach(b=>{b.cd-=speed();if(b.cd>0)return;let done=false;if(b.type==='miner'){const ores=s.ore.filter(o=>o.amount>0&&Math.abs(o.x-b.x)<=1&&Math.abs(o.y-b.y)<=1);if(ores.length){const o=ores[Math.floor(Math.random()*ores.length)];o.amount--;s.res.iron+=4*mult('miner');s.score+=2;done=true}}if(b.type==='smelter'&&s.res.iron>=8){s.res.iron-=8;s.res.parts+=3*mult('smelter');s.score+=4;done=true}if(b.type==='generator'){s.res.power+=4*mult('generator');s.score+=2;done=true}if(b.type==='assembler'&&s.res.iron>=12&&s.res.copper>=8&&s.res.power>=4){s.res.iron-=12;s.res.copper-=8;s.res.power-=4;s.res.parts+=2*mult('assembler');s.score+=7;done=true}if(done)b.cd=32/(speed())});s.res.power=Math.max(0,s.res.power-s.buildings.length*.012);update()}
function draw(){ctx.clearRect(0,0,W,H);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){ctx.fillStyle=(x+y)%2?'#102238':'#132943';ctx.fillRect(x*CELL,y*CELL,CELL,CELL);ctx.strokeStyle='#ffffff0b';ctx.strokeRect(x*CELL,y*CELL,CELL,CELL)}s.ore.forEach(o=>{if(o.amount<=0)return;const col=o.t==='iron'?'#4d9cff':'#ffd166';ctx.fillStyle=col;ctx.beginPath();ctx.arc(o.x*CELL+25,o.y*CELL+25,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#07111f';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText(Math.ceil(o.amount),o.x*CELL+25,o.y*CELL+29)});s.buildings.forEach(b=>{const d=defs[b.type],x=b.x*CELL+5,y=b.y*CELL+5;ctx.fillStyle=d.color;ctx.fillRect(x,y,40,40);ctx.fillStyle='#07111f';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText(d.key,x+20,y+27)});if(s.mouse.over){const gx=Math.floor(s.mouse.x/CELL),gy=Math.floor(s.mouse.y/CELL);if(gx>=0&&gx<COLS&&gy>=0&&gy<ROWS){ctx.strokeStyle='#63e6a4';ctx.lineWidth=3;ctx.strokeRect(gx*CELL+2,gy*CELL+2,CELL-4,CELL-4)}}}
function cell(e){const r=canvas.getBoundingClientRect();const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;s.mouse={x,y,over:true};return{x:Math.floor(x/CELL),y:Math.floor(y/CELL)}}
canvas.onmousemove=e=>{cell(e);draw()};canvas.onmouseleave=()=>{s.mouse.over=false;draw()};canvas.onclick=e=>{const p=cell(e);if(p.x>=0&&p.x<COLS&&p.y>=0&&p.y<ROWS)place(p.x,p.y)};
document.addEventListener('keydown',e=>{if(defs[Object.keys(defs).find(k=>defs[k].key===e.key)])selectMachine(Object.keys(defs).find(k=>defs[k].key===e.key));if(e.key.toLowerCase()==='a')advance();if(e.key.toLowerCase()==='r')ascend()});
function advance(){s.cycle++;s.score+=100+s.cycle*25+(s.skills.drone?150:0);s.sp+=1+(s.skills.drone?1:0);msg('サイクルを進めました。スキルポイントを獲得！');update()}
function ascend(){const gain=Math.max(1,Math.floor(s.score/500));s.prestige+=gain;s.cycle=1;s.score=0;s.res={iron:120+s.prestige*20,copper:60+s.prestige*10,power:30,parts:0};s.buildings=[];s.ore.forEach(o=>o.amount=30);msg('工場を再起動。威信が恒久強化されました。');update()}
document.getElementById('advance').onclick=advance;document.getElementById('ascend').onclick=ascend;makeMachineButtons();update();draw();setInterval(()=>{tick();draw()},1000);
</script>
</body>
</html>
